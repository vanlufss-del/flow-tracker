// ══════════════════════════════════════════════════════════════════════════════
// JSONBin Configuration
// ══════════════════════════════════════════════════════════════════════════════
// ✅ НАСТРОЕНО! Ваши данные JSONBin
const JSONBIN_BIN_ID = '69c28731b7ec241ddc9aef57';
const JSONBIN_API_KEY = '$2a$10$bFa1hG8gYR8jkY0XFTSNNuMFZxgt8Ao2UJI5nJ0DMaivR8TAQHFbm';

const JSONBIN_BASE_URL = 'https://api.jsonbin.io/v3/b';

// ══════════════════════════════════════════════════════════════════════════════
// PWA Service Worker
// ══════════════════════════════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('✓ SW registered'))
      .catch(err => console.log('✗ SW error:', err));
  });
}

// ══════════════════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════════════════
const OP_TYPES = [
  {id:'depA', label:'Внести А', icon:'💰', color:'var(--green)', acct:'A'},
  {id:'wdwA', label:'Вывести А', icon:'💸', color:'var(--red)', acct:'A'},
  {id:'flowAB', label:'Перелить А→Б', icon:'➡️', color:'var(--amber)', acct:'AB'},
  {id:'flowBA', label:'Перелить Б→А', icon:'⬅️', color:'var(--purple)', acct:'BA'},
  {id:'depB', label:'Внести Б', icon:'💵', color:'var(--green)', acct:'B'},
  {id:'wdwB', label:'Вывести Б', icon:'💴', color:'var(--red)', acct:'B'},
  {id:'profitA', label:'Прибыль А', icon:'📈', color:'var(--green)', acct:'A'},
  {id:'lossA', label:'Убыток А', icon:'📉', color:'var(--red)', acct:'A'},
  {id:'profitB', label:'Прибыль Б', icon:'💹', color:'var(--green)', acct:'B'},
  {id:'lossB', label:'Убыток Б', icon:'📊', color:'var(--red)', acct:'B'},
  {id:'bonus', label:'Бонус Б', icon:'🎁', color:'var(--cyan)', acct:'B'},
];

const S = {
  ops: [],
  pairs: [],
  activePair: null,
  tab: 'home',
  modal: null,
  pairModal: null,
  amount: '',
  note: '',
  toast: null,
  pf_name:'', pf_brokerA:'', pf_brokerB:'', pf_noteA:'', pf_noteB:'',
  syncStatus: 'synced'
};

// ══════════════════════════════════════════════════════════════════════════════
// JSONBin Sync Functions
// ══════════════════════════════════════════════════════════════════════════════
async function loadFromCloud() {
  if (JSONBIN_BIN_ID === 'YOUR_BIN_ID_HERE') {
    console.log('⚠️ JSONBin не настроен, используем localStorage');
    loadFromLocal();
    return;
  }

  try {
    S.syncStatus = 'syncing';
    render();

    const response = await fetch(`${JSONBIN_BASE_URL}/${JSONBIN_BIN_ID}/latest`, {
      method: 'GET',
      headers: {
        'X-Master-Key': JSONBIN_API_KEY
      }
    });

    if (!response.ok) throw new Error('Load failed');

    const data = await response.json();
    
    S.ops = data.record.ops || [];
    S.pairs = data.record.pairs || [];
    S.activePair = data.record.activePair || null;

    if(!S.pairs.length){
      S.pairs=[{id:Date.now().toString(),name:'Связка 1',brokerA:'Брокер А',brokerB:'Брокер Б',noteA:'',noteB:''}];
      await saveToCloud();
    }
    if(!S.activePair||!getPair(S.activePair)) S.activePair=S.pairs[0].id;

    saveToLocal();
    S.syncStatus = 'synced';
    render();
  } catch (err) {
    console.error('Ошибка загрузки:', err);
    S.syncStatus = 'offline';
    loadFromLocal();
    render();
  }
}

async function saveToCloud() {
  if (JSONBIN_BIN_ID === 'YOUR_BIN_ID_HERE') {
    saveToLocal();
    return;
  }

  try {
    S.syncStatus = 'syncing';
    render();

    const response = await fetch(`${JSONBIN_BASE_URL}/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify({
        ops: S.ops,
        pairs: S.pairs,
        activePair: S.activePair
      })
    });

    if (!response.ok) throw new Error('Save failed');

    saveToLocal();
    S.syncStatus = 'synced';
    render();
  } catch (err) {
    console.error('Ошибка сохранения:', err);
    S.syncStatus = 'offline';
    saveToLocal();
    render();
  }
}

function loadFromLocal() {
  try { S.ops = JSON.parse(localStorage.getItem('flowOps')||'[]'); } catch(e){}
  try { S.pairs = JSON.parse(localStorage.getItem('flowPairs')||'[]'); } catch(e){}
  try { S.activePair = localStorage.getItem('flowActivePair'); } catch(e){}
  
  if(!S.pairs.length){
    S.pairs=[{id:Date.now().toString(),name:'Связка 1',brokerA:'Брокер А',brokerB:'Брокер Б',noteA:'',noteB:''}];
  }

}

function saveToLocal() {
  localStorage.setItem('flowOps', JSON.stringify(S.ops));
  localStorage.setItem('flowPairs', JSON.stringify(S.pairs));
  localStorage.setItem('flowActivePair', S.activePair);
}

// Ручная синхронизация - автоматическая отключена для экономии запросов
// Синхронизация происходит только при:
// - Открытии приложения (loadFromCloud при старте)
// - Добавлении/изменении данных (saveToCloud при действиях)
// - Нажатии кнопки "Обновить" (новая кнопка)

// ══════════════════════════════════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════════════════════════════════
function fmt(v){return v>=0?'+'+v.toFixed(2):v.toFixed(2);}
function getMeta(id){return OP_TYPES.find(t=>t.id===id)||OP_TYPES[0];}
function getPair(id){return S.pairs.find(p=>p.id===id);}
function getPairColor(i){
  const cols=['var(--cyan)','var(--purple)','var(--amber)','var(--green)','var(--pink)','var(--orange)','var(--blue)'];
  return cols[i%cols.length];
}

function calcForPair(pairId){
  const ops = S.ops.filter(op=>op.pairId===pairId);
  let dA=0,wA=0,fAB=0,fBA=0,pA=0,lA=0;
  let dB=0,wB=0,pB=0,lB=0,bon=0;
  ops.forEach(op=>{
    const v=parseFloat(op.amount)||0;
    switch(op.type){
      case'depA':dA+=v;break;
      case'wdwA':wA+=v;break;
      case'flowAB':fAB+=v;break;
      case'flowBA':fBA+=v;break;
      case'depB':dB+=v;break;
      case'wdwB':wB+=v;break;
      case'profitA':pA+=v;break;
      case'lossA':lA+=v;break;
      case'profitB':pB+=v;break;
      case'lossB':lB+=v;break;
      case'bonus':bon+=v;break;
    }
  });
  const balA=dA-wA-fAB+fBA+pA-lA;
  const balB=dB-wB+fAB-fBA+pB-lB+bon;
  const invested=dA+dB;
  const withdrawn=wA+wB;
  const pnl=pA-lA+pB-lB+bon;
  return {dA,wA,fAB,fBA,pA,lA,dB,wB,pB,lB,bon,balA,balB,invested,withdrawn,pnl,count:ops.length};
}

function calcGlobal(){
  if(S.activePair==="__all__"){
    let dA=0,wA=0,fAB=0,fBA=0,pA=0,lA=0;
    let dB=0,wB=0,pB=0,lB=0,bon=0;
    S.pairs.forEach(p=>{
      const c=calcForPair(p.id);
      dA+=c.dA;wA+=c.wA;fAB+=c.fAB;fBA+=c.fBA;pA+=c.pA;lA+=c.lA;
      dB+=c.dB;wB+=c.wB;pB+=c.pB;lB+=c.lB;bon+=c.bon;
    });
    const balA=dA-wA-fAB+fBA+pA-lA;
    const balB=dB-wB+fAB-fBA+pB-lB+bon;
    const invested=dA+dB;
    const withdrawn=wA+wB;
    const pnl=pA-lA+pB-lB+bon;
    return {dA,wA,fAB,fBA,pA,lA,dB,wB,pB,lB,bon,balA,balB,invested,withdrawn,pnl};
  } else {
    return calcForPair(S.activePair);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// Actions
// ══════════════════════════════════════════════════════════════════════════════
function openModal(opTypeId,editId=null){
  S.modal={opTypeId,editId};
  if(editId){
    const op=S.ops.find(o=>o.id===editId);
    if(op){S.modal.opTypeId=op.type;S.amount=op.amount;S.note=op.note||'';}
  } else {S.amount='';S.note='';}
  render();
  setTimeout(()=>{const inp=document.getElementById('amountInput');if(inp)inp.focus();},100);
}
function closeModal(){S.modal=null;render();}
function setPreset(v){S.amount=v.toString();render();}
async function submitOp(){
  if(!S.amount||parseFloat(S.amount)<=0)return;
  const isEdit=!!S.modal.editId;
  if(isEdit){
    const op=S.ops.find(o=>o.id===S.modal.editId);
    if(op){op.type=S.modal.opTypeId;op.amount=S.amount;op.note=S.note;op.ts=Date.now();}
  } else {
    let pairId = S.activePair==="__all__"?S.pairs[0].id:S.activePair;
    S.ops.push({id:Date.now().toString(),pairId,type:S.modal.opTypeId,amount:S.amount,note:S.note,ts:Date.now()});
  }
  await saveToCloud();
  showToast(isEdit?'✓ Сохранено':'✓ Записано');
  closeModal();
}
async function deleteOp(id){
  if(!confirm('Удалить операцию?'))return;
  S.ops=S.ops.filter(o=>o.id!==id);
  await saveToCloud();
  showToast('✓ Удалено');
  render();
}
async function clearOps(){
  if(!confirm(S.activePair==="__all__"?'Удалить ВСЕ операции?':'Удалить все операции связки?'))return;
  if(S.activePair==="__all__"){S.ops=[];}
  else{S.ops=S.ops.filter(op=>op.pairId!==S.activePair);}
  await saveToCloud();
  showToast('✓ Очищено');
  render();
}

function openPairModal(pairId){
  S.pairModal=pairId;
  if(pairId==='new'){
    S.pf_name='';S.pf_brokerA='';S.pf_brokerB='';S.pf_noteA='';S.pf_noteB='';
  } else {
    const p=getPair(pairId);
    if(p){
      S.pf_name=p.name;S.pf_brokerA=p.brokerA;S.pf_brokerB=p.brokerB;
      S.pf_noteA=p.noteA||'';S.pf_noteB=p.noteB||'';
    }
  }
  render();
}
function closePairModal(){S.pairModal=null;render();}
async function savePair(){
  if(!S.pf_name.trim()||!S.pf_brokerA.trim()||!S.pf_brokerB.trim()){
    alert('Заполните название и оба брокера');return;
  }
  if(S.pairModal==='new'){
    const newPair={
      id:Date.now().toString(),name:S.pf_name,brokerA:S.pf_brokerA,brokerB:S.pf_brokerB,
      noteA:S.pf_noteA,noteB:S.pf_noteB
    };
    S.pairs.push(newPair);
    S.activePair=newPair.id;
    showToast('✓ Связка создана');
  } else {
    const p=getPair(S.pairModal);
    if(p){
      p.name=S.pf_name;p.brokerA=S.pf_brokerA;p.brokerB=S.pf_brokerB;
      p.noteA=S.pf_noteA;p.noteB=S.pf_noteB;
      showToast('✓ Сохранено');
    }
  }
  await saveToCloud();
  closePairModal();
}
async function deletePair(id){
  if(S.pairs.length===1){alert('Нельзя удалить последнюю связку');return;}
  if(!confirm('Удалить связку и все её операции?'))return;
  S.pairs=S.pairs.filter(p=>p.id!==id);
  S.ops=S.ops.filter(op=>op.pairId!==id);
  if(S.activePair===id)S.activePair=S.pairs[0].id;
  await saveToCloud();
  showToast('✓ Связка удалена');
  render();
}

function showToast(msg){
  S.toast=msg;
  render();
  setTimeout(()=>{S.toast=null;render();},2000);
}

async function manualSync(){
  await loadFromCloud();
  showToast('🔄 Обновлено');
}

        <div>
          <div style="font-size:12px;color:var(--cyan);margin-bottom:4px">Брокер А</div>
          <input class="text-input" style="margin-top:0" placeholder="Название брокера"
            value="${S.pf_brokerA.replace(/"/g,'&quot;')}" oninput="S.pf_brokerA=this.value">
        </div>
        <div>
          <div style="font-size:12px;color:var(--purple);margin-bottom:4px">Брокер Б</div>
          <input class="text-input" style="margin-top:0" placeholder="Название брокера"
            value="${S.pf_brokerB.replace(/"/g,'&quot;')}" oninput="S.pf_brokerB=this.value">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px">
        <div>
          <div style="font-size:11px;color:var(--dark);margin-bottom:4px">Заметка по А (счёт и т.д.)</div>
          <input class="text-input" style="margin-top:0" placeholder="№ счёта, логин..."
            value="${S.pf_noteA.replace(/"/g,'&quot;')}" oninput="S.pf_noteA=this.value">
        </div>
        <div>
          <div style="font-size:11px;color:var(--dark);margin-bottom:4px">Заметка по Б</div>
          <input class="text-input" style="margin-top:0" placeholder="№ счёта, логин..."
            value="${S.pf_noteB.replace(/"/g,'&quot;')}" oninput="S.pf_noteB=this.value">
        </div>
      </div>
      <button class="submit-btn" style="background:var(--cyan);color:#000"
        onclick="savePair()">${isNew?'✓ Создать связку':'💾 Сохранить'}</button>
    </div></div>`;
  }

  if(S.toast) h+=`<div class="toast">${S.toast}</div>`;

  app.innerHTML=h;
}

loadFromCloud();
render();
</script>



</body></html>
